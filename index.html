<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tranquilizer — All Work Combined</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAFAF9;
    --surface:#FFFFFF;
    --border:#E6E5E1;
    --text:#17181A;
    --text-muted:#6E6E68;
    --text-faint:#A3A29C;
    --accent:#3552F0;
    --accent-soft:#EBEEFE;
    --ok:#1E9E6B;
    --warn:#D97A26;
    --radius:12px;
    --radius-sm:8px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
  }
  a{color:inherit;text-decoration:none;}

  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:0 20px 90px;
  }

  /* ---------- Header ---------- */
  header{
    padding:40px 0 22px;
  }
  .eyebrow-top{
    font-size:12.5px;
    font-weight:600;
    color:var(--accent);
    letter-spacing:.06em;
    text-transform:uppercase;
    margin-bottom:8px;
  }
  h1{
    font-family:'Sora',sans-serif;
    font-weight:700;
    font-size:clamp(28px,7vw,38px);
    line-height:1.15;
    margin:0 0 10px;
    letter-spacing:-.01em;
  }
  h1 .accent{color:var(--accent);}
  .subtitle{
    font-size:15px;
    color:var(--text-muted);
    max-width:48ch;
  }

  /* ---------- Sync line ---------- */
  .sync{
    margin-top:18px;
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12.5px;
    color:var(--text-faint);
  }
  .dot{
    width:7px;height:7px;
    border-radius:50%;
    background:var(--ok);
    flex:0 0 auto;
  }
  .dot.offline{background:var(--warn);}

  /* ---------- Filter chips (signature element) ---------- */
  .chips{
    position:sticky;
    top:0;
    z-index:10;
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:14px 0;
    margin:8px -20px 0;
    padding-left:20px;
    padding-right:20px;
    background:linear-gradient(var(--bg) 70%, rgba(250,250,249,0));
    scrollbar-width:none;
  }
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;
    font-size:13px;
    font-weight:500;
    padding:7px 14px;
    border-radius:100px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text-muted);
    cursor:pointer;
    white-space:nowrap;
    transition:all .15s ease;
  }
  .chip:hover{border-color:var(--accent);color:var(--text);}
  .chip.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }

  /* ---------- Sections ---------- */
  .section{
    margin-top:38px;
    scroll-margin-top:70px;
  }
  .section-head{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:4px;
  }
  .section-index{
    font-family:'Sora',sans-serif;
    font-size:12px;
    font-weight:600;
    color:var(--accent);
    background:var(--accent-soft);
    width:24px;height:24px;
    border-radius:7px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:0 0 auto;
  }
  .section-title{
    font-family:'Sora',sans-serif;
    font-size:19px;
    font-weight:600;
  }
  .section-note{
    font-size:13px;
    color:var(--text-muted);
    margin:6px 0 14px 34px;
  }

  .item{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px;
    margin-bottom:8px;
    border-radius:var(--radius-sm);
    border:1px solid var(--border);
    background:var(--surface);
    transition:border-color .15s ease, transform .1s ease, box-shadow .15s ease;
  }
  .item:hover, .item:focus-visible{
    border-color:var(--accent);
    box-shadow:0 4px 14px rgba(53,82,240,.08);
    outline:none;
  }
  .item-tag{
    flex:0 0 auto;
    font-size:10px;
    font-weight:600;
    letter-spacing:.04em;
    color:var(--accent);
    background:var(--accent-soft);
    padding:4px 7px;
    border-radius:5px;
    text-transform:uppercase;
  }
  .item-body{flex:1 1 auto;min-width:0;}
  .item-title{
    font-weight:600;
    font-size:14.5px;
    color:var(--text);
    margin-bottom:2px;
  }
  .item-desc{
    font-size:12.5px;
    color:var(--text-muted);
  }
  .item-arrow{
    flex:0 0 auto;
    color:var(--text-faint);
    font-size:16px;
    transition:transform .15s ease, color .15s ease;
  }
  .item:hover .item-arrow{transform:translateX(3px);color:var(--accent);}

  /* ---------- Footer ---------- */
  footer{
    margin-top:56px;
    padding-top:18px;
    border-top:1px solid var(--border);
    font-size:12px;
    color:var(--text-faint);
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
  }

  .loading{
    padding:40px 4px;
    color:var(--text-muted);
    font-size:13px;
  }

  @media (max-width:480px){
    .wrap{padding:0 16px 70px;}
    .chips{margin:8px -16px 0;padding-left:16px;padding-right:16px;}
  }

  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    .item, .item-arrow, .chip{transition:none;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow-top">Tranquilizer</div>
    <h1>All work, <span class="accent">combined</span>.</h1>
    <div class="subtitle">Everything for NDA / CDS prep — tools, guides, batches, material, and community — in one place.</div>

    <div class="sync">
      <span class="dot" id="syncDot"></span>
      <span id="syncLabel">Syncing…</span>
      <span>·</span>
      <span>Requires internet for the latest links</span>
    </div>
  </header>

  <nav class="chips" id="chips"></nav>

  <main id="sections">
    <div class="loading">Loading…</div>
  </main>

  <footer>
    <span>Maintained by Tranquilizer</span>
    <span id="updatedFooter"></span>
  </footer>

</div>

<script>

  dataUrl: "https://cdn.jsdelivr.net/gh/tranquilizer014/Tranquilizer_work@main/data.json",
  fetchTimeoutMs: 6000

/* Fallback copy — used instantly if the live fetch fails (e.g. no internet) */

        {

};

function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), ms))
  ]);
}

function escapeHtml(str){
  const div = document.createElement("div");
  div.textContent = str == null ? "" : String(str);
  return div.innerHTML;
}

function slugify(str){
  return "sec-" + String(str).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
}

function render(data, isLive){
  const main = document.getElementById("sections");
  const chips = document.getElementById("chips");
  main.innerHTML = "";
  chips.innerHTML = "";

  const allChip = document.createElement("button");
  allChip.className = "chip active";
  allChip.textContent = "All";
  allChip.onclick = () => setActiveChip(allChip);
  chips.appendChild(allChip);

  data.sections.forEach((section, i) => {
    const id = slugify(section.title || ("section-" + i));

    const chip = document.createElement("button");
    chip.className = "chip";
    chip.textContent = section.short || section.title;
    chip.onclick = () => {
      setActiveChip(chip);
      document.getElementById(id).scrollIntoView({behavior:"smooth", block:"start"});
    };
    chips.appendChild(chip);

    const sec = document.createElement("section");
    sec.className = "section";
    sec.id = id;

    const head = document.createElement("div");
    head.className = "section-head";
    head.innerHTML = `<span class="section-index">${escapeHtml(section.eyebrow || (i+1))}</span><span class="section-title">${escapeHtml(section.title || "")}</span>`;
    sec.appendChild(head);

    if(section.note){
      const note = document.createElement("div");
      note.className = "section-note";
      note.textContent = section.note;
      sec.appendChild(note);
    }

    (section.items || []).forEach(item => {
      const a = document.createElement("a");
      a.className = "item";
      a.href = item.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.innerHTML = `
        <span class="item-tag">${escapeHtml(item.tag || "")}</span>
        <span class="item-body">
          <span class="item-title">${escapeHtml(item.title || "")}</span>
          <span class="item-desc">${escapeHtml(item.desc || "")}</span>
        </span>
        <span class="item-arrow">→</span>
      `;
      sec.appendChild(a);
    });

    main.appendChild(sec);
  });

  function setActiveChip(target){
    chips.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
    target.classList.add("active");
  }

  document.getElementById("updatedFooter").textContent = data.updated ? `Last updated ${data.updated}` : "";

  const dot = document.getElementById("syncDot");
  const label = document.getElementById("syncLabel");
  if(isLive){
    dot.classList.remove("offline");
    label.textContent = "Live";
  } else {
    dot.classList.add("offline");
    label.textContent = "Offline copy";
  }
}

async function init(){
  try {
    if(!CONFIG.dataUrl || CONFIG.dataUrl.startsWith("REPLACE_WITH")){
      throw new Error("no url configured yet");
    }
    const res = await withTimeout(fetch(CONFIG.dataUrl, {cache:"no-store"}), CONFIG.fetchTimeoutMs);
    if(!res.ok) throw new Error("bad response");
    const data = await res.json();
    render(data, true);
  } catch(err){
    render(FALLBACK_DATA, false);
  }
}

init();
</script>
</body>
</html>
